version: '3.8'

services:
  # AstroPlanAI CLI application
  # Connects to external LLM server (OpenAI-compatible API)
  astroplanai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astroplan-app
    volumes:
      - ./workspace:/workspace
      - ./examples:/app/examples:ro
    environment:
      # Set LLM_BASE_URL to your LLM server endpoint
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-not_required}
      - LLM_MODEL=${LLM_MODEL}
      - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS:-60}
      - AGENT_TEMPERATURE=${AGENT_TEMPERATURE:-0.7}
      - AGENT_MAX_TOKENS=${AGENT_MAX_TOKENS:-2048}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["/bin/bash"]

  # AstroPlanAI Web UI (Streamlit)
  # Connects to external LLM server (OpenAI-compatible API)
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: astroplan-web
    ports:
      - "8501:8501"
    volumes:
      # Mount webapp and src for auto-reload on changes
      - ./webapp:/app/webapp
      - ./src:/app/src
    environment:
      # Set LLM_BASE_URL to your LLM server endpoint
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-not_required}
      - LLM_MODEL=${LLM_MODEL}
      - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS:-60}
      - AGENT_TEMPERATURE=${AGENT_TEMPERATURE:-0.7}
      - AGENT_MAX_TOKENS=${AGENT_MAX_TOKENS:-2048}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
